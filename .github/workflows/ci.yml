name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  lint-and-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix apps/api ci
          npm --prefix apps/web ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  api-tests:
    name: API tests (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uptime
          POSTGRES_PASSWORD: uptime_dev
          POSTGRES_DB: uptime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uptime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://uptime:uptime_dev@localhost:5432/uptime
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API dependencies
        run: npm --prefix apps/api ci

      - name: Run API tests
        run: npm --prefix apps/api test

  web-e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix apps/web ci

      - name: Install Playwright browser
        run: npm --prefix apps/web exec -- playwright install chromium --only-shell --with-deps

      - name: Build web app
        run: npm --prefix apps/web run build

      - name: Run Playwright tests
        run: npm --prefix apps/web run test:e2e

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7