services:
  worker:
    build: ./apps/api
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgres://uptime:uptime_dev@postgres:5432/uptime
      REDIS_URL: redis://redis:6379
      WORKER_POLL_MS: 10000
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-alerts@pulseops.local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3002:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build: ./apps/api
    environment:
      PORT: 3000
      DATABASE_URL: postgres://uptime:uptime_dev@postgres:5432/uptime
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-development-secret-change-me
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:3002,http://localhost:3000,http://127.0.0.1:3102}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-300}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-20}
      REFRESH_RATE_LIMIT: ${REFRESH_RATE_LIMIT:-60}
      CHECK_RATE_LIMIT: ${CHECK_RATE_LIMIT:-10}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-alerts@pulseops.local}
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: uptime_dev
      POSTGRES_DB: uptime
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime -d uptime"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
